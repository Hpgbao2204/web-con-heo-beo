<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quản lý chữ ký</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #181b22;
      --line: #2a2f3a;
      --text: #e8eaf0;
      --muted: #8b92a3;
      --accent: #f2c66d;
      --danger: #e5675f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    h1 { font-size: 22px; margin: 0; }
    h2 { font-size: 16px; margin: 32px 0 12px; color: var(--muted); font-weight: 600; }
    a { color: var(--accent); }
    button {
      font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--panel);
      color: var(--text); padding: 8px 14px; border-radius: 8px;
    }
    button:hover { border-color: var(--muted); }
    button.primary { background: var(--accent); color: #1a1408; border-color: var(--accent); font-weight: 600; }
    button.danger { color: var(--danger); }
    button:disabled { opacity: .5; cursor: default; }

    #drop {
      margin-top: 20px; border: 2px dashed var(--line); border-radius: 14px; padding: 40px 16px;
      text-align: center; color: var(--muted); cursor: pointer; transition: border-color .15s, background .15s;
    }
    #drop.over { border-color: var(--accent); background: #f2c66d10; }
    #drop strong { color: var(--text); }

    .controls { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin-top: 16px; }
    .controls label { display: flex; gap: 8px; align-items: center; color: var(--muted); }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
    .card {
      background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
      display: flex; flex-direction: column;
    }
    .card .img {
      aspect-ratio: 16 / 9; display: grid; place-items: center; padding: 10px;
      background: radial-gradient(circle at 50% 40%, #232836, #0b0d12);
    }
    .card img { max-width: 100%; max-height: 100%; }
    .card .meta { padding: 8px 10px; display: flex; gap: 8px; align-items: center; justify-content: space-between; font-size: 13px; color: var(--muted); }
    .card .meta span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card .meta button { padding: 4px 10px; font-size: 13px; }
    .empty { color: var(--muted); font-size: 14px; }
    #status { color: var(--muted); font-size: 14px; min-height: 1.5em; margin-top: 8px; }
  </style>
</head>
<body>
<main>
  <header>
    <h1>Quản lý chữ ký</h1>
    <a href="/display.html" target="_blank">Mở màn hình TV ↗</a>
  </header>

  <div id="drop">
    <strong>Kéo thả file vào đây</strong> hoặc bấm để chọn<br />
    PNG, JPG hoặc PDF. Mỗi trang PDF được tính là một chữ ký.
    <input id="file" type="file" accept="image/png,image/jpeg,application/pdf" multiple hidden />
  </div>

  <div class="controls">
    <label>Độ nhạy nền
      <input id="threshold" type="range" min="120" max="245" value="200" />
      <output id="thresholdVal">200</output>
    </label>
    <button id="publishAll" class="primary" disabled>Đăng tất cả</button>
    <button id="clearPending" disabled>Bỏ hết</button>
  </div>
  <div id="status"></div>

  <h2>Chờ đăng</h2>
  <div id="pending" class="grid"></div>
  <p id="pendingEmpty" class="empty">Chưa có file nào.</p>

  <h2>Đã đăng (<span id="count">0</span>)</h2>
  <div id="published" class="grid"></div>
</main>

<script type="module">
  import * as pdfjs from '/vendor/pdfjs/pdf.min.mjs';
  pdfjs.GlobalWorkerOptions.workerSrc = '/vendor/pdfjs/pdf.worker.min.mjs';

  const MAX_OUTPUT = 800;   // cạnh dài nhất của ảnh gửi lên server
  const MAX_WORK = 1600;    // cạnh dài nhất khi xử lý
  const EDGE_IGNORE = 0.02; // bỏ qua viền scan (bóng đen mép giấy)

  const $ = (id) => document.getElementById(id);
  const drop = $('drop'), fileInput = $('file'), threshold = $('threshold');

  /** Mỗi item: { id, name, source: canvas gốc, blob, url, width, height } */
  let pending = [];

  // ---------- Đọc file thành canvas ----------
  async function fileToCanvases(file) {
    if (file.type === 'application/pdf') {
      const pdf = await pdfjs.getDocument({ data: await file.arrayBuffer() }).promise;
      const out = [];
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const base = page.getViewport({ scale: 1 });
        const scale = MAX_WORK / Math.max(base.width, base.height);
        const viewport = page.getViewport({ scale });
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(viewport.width);
        canvas.height = Math.round(viewport.height);
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        // intent 'print' để pdf.js không chờ requestAnimationFrame (bị dừng khi tab ẩn)
        await page.render({ canvasContext: ctx, viewport, intent: 'print' }).promise;
        out.push({ canvas, name: pdf.numPages > 1 ? `${file.name} · trang ${i}` : file.name });
      }
      return out;
    }
    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, MAX_WORK / Math.max(bmp.width, bmp.height));
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(bmp.width * scale);
    canvas.height = Math.round(bmp.height * scale);
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff'; // PNG trong suốt thì coi như nền trắng
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(bmp, 0, 0, canvas.width, canvas.height);
    return [{ canvas, name: file.name }];
  }

  // ---------- Xoá nền, đổi mực thành trắng, cắt sát, thu nhỏ ----------
  async function processCanvas(src, thr) {
    const { width: w, height: h } = src;
    const img = src.getContext('2d').getImageData(0, 0, w, h);
    const d = img.data;
    const low = thr - 90; // tối hơn mức này = mực đậm hoàn toàn
    const ex = Math.round(w * EDGE_IGNORE), ey = Math.round(h * EDGE_IGNORE);
    let minX = w, minY = h, maxX = -1, maxY = -1;

    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const i = (y * w + x) * 4;
        const lum = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
        let a = (thr - lum) / (thr - low);
        a = a <= 0 ? 0 : a >= 1 ? 1 : a;
        if (x < ex || y < ey || x >= w - ex || y >= h - ey) a = 0;
        d[i] = d[i + 1] = d[i + 2] = 255;
        d[i + 3] = Math.round(a * 255);
        if (a > 0.15) {
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
        }
      }
    }
    if (maxX < 0) return null; // không tìm thấy nét mực

    const full = document.createElement('canvas');
    full.width = w; full.height = h;
    full.getContext('2d').putImageData(img, 0, 0);

    const pad = Math.round(Math.max(maxX - minX, maxY - minY) * 0.04) + 4;
    const cx = Math.max(0, minX - pad), cy = Math.max(0, minY - pad);
    const cw = Math.min(w, maxX + pad) - cx, ch = Math.min(h, maxY + pad) - cy;
    const scale = Math.min(1, MAX_OUTPUT / Math.max(cw, ch));

    const out = document.createElement('canvas');
    out.width = Math.max(1, Math.round(cw * scale));
    out.height = Math.max(1, Math.round(ch * scale));
    const octx = out.getContext('2d');
    octx.imageSmoothingQuality = 'high';
    octx.drawImage(full, cx, cy, cw, ch, 0, 0, out.width, out.height);

    let blob = await new Promise((r) => out.toBlob(r, 'image/webp', 0.9));
    if (!blob || blob.type !== 'image/webp') blob = await new Promise((r) => out.toBlob(r, 'image/png'));
    return { blob, width: out.width, height: out.height };
  }

  async function processItem(item) {
    const res = await processCanvas(item.source, Number(threshold.value));
    if (item.url) URL.revokeObjectURL(item.url);
    if (!res) {
      Object.assign(item, { blob: null, url: null, width: 0, height: 0 });
      return;
    }
    Object.assign(item, res, { url: URL.createObjectURL(res.blob) });
  }

  // ---------- Thêm file ----------
  async function addFiles(files) {
    const t0 = performance.now();
    setStatus('Đang xử lý…');
    for (const file of files) {
      try {
        for (const { canvas, name } of await fileToCanvases(file)) {
          const item = { id: crypto.randomUUID(), name, source: canvas };
          await processItem(item);
          pending.push(item);
          renderPending();
        }
      } catch (err) {
        console.error(err);
        setStatus(`Lỗi đọc ${file.name}: ${err.message}`);
      }
    }
    setStatus(`Xử lý xong trong ${Math.round(performance.now() - t0)} ms`);
  }

  // ---------- Đăng ----------
  async function publish(item) {
    if (!item.blob) return false;
    const res = await fetch('/api/signatures', {
      method: 'POST',
      headers: { 'Content-Type': item.blob.type, 'X-Width': item.width, 'X-Height': item.height },
      body: item.blob,
    });
    if (!res.ok) throw new Error((await res.json()).error || res.statusText);
    URL.revokeObjectURL(item.url);
    pending = pending.filter((p) => p !== item);
    return true;
  }

  async function publishAll() {
    const items = pending.filter((p) => p.blob);
    if (!items.length) return;
    $('publishAll').disabled = true;
    const t0 = performance.now();
    let ok = 0;
    for (const item of items) {
      try { if (await publish(item)) ok++; } catch (err) { setStatus(`Lỗi: ${err.message}`); }
    }
    renderPending();
    setStatus(`Đã đăng ${ok} chữ ký trong ${Math.round(performance.now() - t0)} ms`);
  }

  // ---------- Render ----------
  function setStatus(msg) { $('status').textContent = msg; }

  function card(src, label, buttons) {
    const el = document.createElement('div');
    el.className = 'card';
    el.innerHTML = `<div class="img"></div><div class="meta"><span></span><div></div></div>`;
    if (src) {
      const img = new Image();
      img.src = src;
      el.querySelector('.img').append(img);
    } else {
      el.querySelector('.img').textContent = 'Không thấy nét mực';
    }
    el.querySelector('.meta span').textContent = label;
    el.querySelector('.meta span').title = label;
    el.querySelector('.meta div').append(...buttons);
    return el;
  }

  function btn(text, cls, onClick) {
    const b = document.createElement('button');
    b.textContent = text;
    if (cls) b.className = cls;
    b.onclick = onClick;
    return b;
  }

  function renderPending() {
    const box = $('pending');
    box.replaceChildren(...pending.map((item) => {
      const publishBtn = btn('Đăng', 'primary', async () => {
        publishBtn.disabled = true;
        try { await publish(item); renderPending(); setStatus('Đã đăng'); }
        catch (err) { publishBtn.disabled = false; setStatus(`Lỗi: ${err.message}`); }
      });
      publishBtn.disabled = !item.blob;
      const removeBtn = btn('Bỏ', '', () => {
        if (item.url) URL.revokeObjectURL(item.url);
        pending = pending.filter((p) => p !== item);
        renderPending();
      });
      return card(item.url, item.name, [removeBtn, publishBtn]);
    }));
    $('pendingEmpty').hidden = pending.length > 0;
    $('publishAll').disabled = !pending.some((p) => p.blob);
    $('clearPending').disabled = pending.length === 0;
  }

  async function loadPublished() {
    const list = await (await fetch('/api/signatures')).json();
    $('count').textContent = list.length;
    $('published').replaceChildren(...list.slice().reverse().map((sig) =>
      card(sig.url, new Date(sig.createdAt).toLocaleString('vi-VN'), [
        btn('Xoá', 'danger', async () => {
          if (!confirm('Xoá chữ ký này khỏi màn hình?')) return;
          await fetch(`/api/signatures/${sig.id}`, { method: 'DELETE' });
        }),
      ])
    ));
  }

  // ---------- Sự kiện ----------
  drop.onclick = () => fileInput.click();
  fileInput.onchange = () => { addFiles([...fileInput.files]); fileInput.value = ''; };
  drop.ondragover = (e) => { e.preventDefault(); drop.classList.add('over'); };
  drop.ondragleave = () => drop.classList.remove('over');
  drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove('over'); addFiles([...e.dataTransfer.files]); };

  let reprocessTimer;
  threshold.oninput = () => {
    $('thresholdVal').textContent = threshold.value;
    clearTimeout(reprocessTimer);
    reprocessTimer = setTimeout(async () => {
      for (const item of pending) await processItem(item);
      renderPending();
    }, 150);
  };

  $('publishAll').onclick = publishAll;
  $('clearPending').onclick = () => {
    pending.forEach((p) => p.url && URL.revokeObjectURL(p.url));
    pending = [];
    renderPending();
  };

  // Danh sách "Đã đăng" tự cập nhật qua cùng kênh realtime với màn TV
  const events = new EventSource('/api/events');
  events.addEventListener('added', loadPublished);
  events.addEventListener('removed', loadPublished);
  events.addEventListener('open', loadPublished);

  renderPending();
</script>
</body>
</html>
